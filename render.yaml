# Render blueprint (FREE plan, demo): one web service running API + 4 storage nodes + embedded database. Data is ephemeral.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the four secrets when prompted.
services:
  - type: web
    name: vault-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.demo
    dockerContext: .
    plan: free                  # 512 MB RAM, no disk (data is lost on restart), sleeps after 15 min idle. Use "standard" + the disk below for real use.
    healthCheckPath: /actuator/health
    # disk is not available on the free plan; on a paid plan add:
    # disk: { name: vault-data, mountPath: /data, sizeGB: 1 }
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: VAULT_GOOGLE_CLIENT_ID
        sync: false
      - key: VAULT_ADMIN_EMAILS
        sync: false
      - key: VAULT_ADMIN_PASSWORD
        sync: false
      - key: VAULT_CORS_ORIGINS      # your Vercel URL, e.g. https://vault-yourname.vercel.app
        sync: false
      - key: VAULT_TOKEN_SECRET
        generateValue: true
